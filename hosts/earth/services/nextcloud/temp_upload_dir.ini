; PHP spools every request body > 2MB (incl. WebDAV PUT chunks from all clients)
; to upload_tmp_dir, even with nginx `fastcgi_request_buffering off`.
; Default is /tmp inside the container = docker root disk, which filled up and broke big uploads.
; - dir must exist and be writable by www-data (uid 33), else PHP silently falls back to /tmp
;   (log: "file created in the system's temporary directory")
; - files of killed requests (timeout, restart) are never cleaned up here, check occasionally
; - Nextcloud's own temp files (zip downloads etc.) are separate: `tempdirectory` in config.php
upload_tmp_dir = /var/www/data/temp_upload/
