; Mounted as zz-nextcloud.conf so it loads after the image's www.conf and overrides it.
[www]
; Image default is pm.max_children = 5: a few syncing clients block everything (web UI hangs, 502/504).
; One child = one concurrent PHP request. Worst-case RAM = max_children x PHP memory_limit
; (image default 512M), so lower this if RAM gets tight.
pm = dynamic
pm.max_children = 60
; Idle pool: start with 15, keep 10-30 spare to absorb sync bursts without forking delay.
pm.start_servers = 15
pm.min_spare_servers = 10
pm.max_spare_servers = 30
; Recycle a child after 500 requests to cap slow memory leaks.
pm.max_requests = 500
; Kill requests running longer than 1h (big uploads/chunk assembly). Keep in sync with
; fastcgi_read_timeout/fastcgi_send_timeout in nginx.conf. Killed uploads leave orphans
; in upload_tmp_dir (see temp_upload_dir.ini).
request_terminate_timeout = 3600
